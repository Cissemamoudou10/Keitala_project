[project]
name = "keitala-api"
version = "0.1.0"
description = "Backend FastAPI pour l'ERP Keitala"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pyjwt[crypto]>=2.9.0",
    "pwdlib[argon2,bcrypt]>=0.2.0",
    "python-multipart>=0.0.17",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
# B008 : Depends() en valeur par défaut est l'usage normal de FastAPI
# N818 : les exceptions portent des noms français (ErreurMetier), sans suffixe « Error »
ignore = ["B008", "N818"]

[tool.ruff.lint.per-file-ignores]
# SQL recopié à l'identique de schema.sql : on ne le recoupe pas
"alembic/versions/0001_schema_initial.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# Le dossier alembic/ du projet ne doit pas faire passer la bibliothèque pour du code local
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
