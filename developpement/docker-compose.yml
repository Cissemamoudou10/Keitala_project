name: keitala

services:
  db:
    image: postgres:16-alpine
    container_name: keitala_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-keitala_db}
      POSTGRES_USER: ${POSTGRES_USER:-keitala_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-keitala_dev_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-keitala_user} -d ${POSTGRES_DB:-keitala_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: keitala_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=dev
      - DEBUG=true
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-keitala_user}:${POSTGRES_PASSWORD:-keitala_dev_password}@db:5432/${POSTGRES_DB:-keitala_db}
      # Base distincte, recréée à chaque lancement des tests
      - TEST_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-keitala_user}:${POSTGRES_PASSWORD:-keitala_dev_password}@db:5432/keitala_test_db
    volumes:
      - ./api:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
    name: keitala_pgdata
